services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: poplens_dev
    ports:
      - "5541:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d poplens_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile
    # The production build prerenders public pages from the database, so the
    # build runs here (db reachable), not at image-build time. First boot
    # takes several minutes; later boots reuse the cached .next volume.
    command: sh -c "pnpm db:migrate && pnpm build && pnpm start"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/poplens_dev
      APP_URL: http://localhost:3000
      NODE_ENV: production
      # All ADAPTERs default to mock (no external calls). AUTH_MODE must be
      # real in production — the app refuses to start otherwise — and that
      # only controls the refusal; auth still works fully offline.
      AUTH_MODE: real
      AUTH_SECRET: compose-demo-secret-0123456789abcdefghijklmnop
    ports:
      - "3000:3000"
    volumes:
      - nextbuild:/app/.next
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: pnpm worker
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/poplens_dev
      APP_URL: http://localhost:3000
      NODE_ENV: production
      AUTH_MODE: real
      AUTH_SECRET: compose-demo-secret-0123456789abcdefghijklmnop
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  nextbuild:
